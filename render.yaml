services:
  - type: web
    name: cabaka-credit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker so all runs share the in-memory run store; threads handle concurrency.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 300 --bind 0.0.0.0:$PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.10
